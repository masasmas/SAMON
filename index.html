<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>DATING</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#050a19;
    color:white;
    font-family:Arial,Helvetica,sans-serif;
}

/* HEADER */
.header{
    height:37px;
    background:#111216;
    display:flex;
    align-items:center;
    padding:0 10px;
    gap:10px;
}

.menu{
    font-size:21px;
    color:white;
}

.logo{
    color:#00c9f2;
    font-size:13px;
    font-weight:bold;
}

.search{
    flex:1;
    height:24px;
    background:#08090d;
    border:1px solid #20232b;
    color:white;
    padding:0 10px;
    font-size:11px;
    outline:none;
}

/* CONTENT */
.container{
    width:336px;
    max-width:calc(100% - 20px);
    margin:12px auto 0;
    text-align:center;
}

/* VIDEO */
.video-box{
    width:100%;
    height:253px;
    background:#000;
    border:1px solid #0b2a46;
    border-radius:14px;
    overflow:hidden;
    box-shadow:0 0 18px rgba(0,170,255,.15);
}

.video-box video{
    width:100%;
    height:100%;
    object-fit:contain;
}

/* TITLE */
.title{
    margin-top:16px;
    font-size:20px;
    font-weight:bold;
}

/* WATCHING */
.watching{
    margin-top:17px;
    color:#00c9f2;
    font-size:13px;
}

/* INFO */
.info{
    margin-top:13px;
    margin-bottom:10px;
    color:#c4cbd6;
    font-size:11px;
}

/* SERVER */
.server{
    width:100%;
    height:39px;
    margin-bottom:10px;
    border:0;
    border-radius:12px;
    background:#06243a;
    color:white;
    font-size:14px;
    cursor:pointer;
}

.server:hover{
    background:#0a3551;
}

/* TELEGRAM */
.telegram{
    display:block;
    width:100%;
    height:38px;
    line-height:38px;
    border-radius:12px;
    background:linear-gradient(100deg,#0788c8,#00bfe9);
    color:white;
    text-decoration:none;
    font-size:13px;
    margin-top:0;
}

/* FOOTER */
.footer{
    margin-top:23px;
    padding-top:25px;
    padding-bottom:12px;
    border-top:1px solid #1c2230;
    color:#c5ccd7;
    font-size:10px;
    line-height:1.8;
}

.footer a{
    color:#00c9f2;
    text-decoration:none;
}

.disclaimer{
    color:#7f899b;
}
</style>
</head>

<body>

<!-- HEADER -->
<div class="header">
    <div class="menu">☰</div>
    <div class="logo">DATING</div>

    <input
        class="search"
        type="text"
        placeholder="Search videos..."
    >
</div>


<!-- CONTENT -->
<div class="container">

    <!-- VIDEO -->
    <div class="video-box">

        <!-- GANTI LINK VIDEO DI BAWAH -->
        <video controls poster="">
            <source
                src="https://example.com/video.mp4"
                type="video/mp4"
            >
        </video>

    </div>


    <!-- TITLE -->
    <div class="title">
        🔥 More Videos 🔥
    </div>


    <!-- WATCHING -->
    <div class="watching">
        👁️ 12,886 people watching
    </div>


    <!-- INFO -->
    <div class="info">
        ⚠️ If the video cannot be opened, choose another server
    </div>


    <!-- SERVER 1 -->
    <button
        class="server"
        onclick="changeVideo('https://example.com/video1.mp4')">
        ▶️ Server 1
    </button>


    <!-- SERVER 2 -->
    <button
        class="server"
        onclick="changeVideo('https://example.com/video2.mp4')">
        ▶️ Server 2
    </button>


    <!-- SERVER 3 -->
    <button
        class="server"
        onclick="changeVideo('https://example.com/video3.mp4')">
        ▶️ Server 3
    </button>


    <!-- TELEGRAM -->
    <a
        class="telegram"
        href="https://t.me/"
        target="_blank">
        ▪️ Join Telegram
    </a>


    <!-- FOOTER -->
    <div class="footer">

        © 2026
        <a href="#">Streaming Premium</a>.
        All rights reserved.

        <br>

        <a href="#">Privacy Policy</a>
        ·
        <a href="#">Terms</a>
        ·
        <a href="#">Contact</a>

        <div class="disclaimer">
            Disclaimer: For entertainment purposes only.
        </div>

    </div>

</div>


<script>

function changeVideo(url){

    const video = document.querySelector("video");

    video.src = url;

    video.load();

    video.play().catch(function(){
        console.log("Tekan tombol Play untuk memulai video.");
    });

}

</script>

</body>
</html>
